     もし「URLを知っている人だけに見せたい」に変えたくなったら、
     下の行を  <meta name="robots" content="noindex,nofollow">  に書きかえてください。 -->

<title>#ポケスリぬい活部 デジタル写真たて</title>

<!-- ポケスリと同じ書体「M PLUS 1p」を読み込みます。
     800 = Heavy（基本の太さ）、700 = Bold（13.5pxより小さい文字用）の
     2種類だけ読み込んで、表示が重くならないようにしています。
     ※ CSSで使う太さと、ここで読み込む太さは必ずそろえてください。
        ずれていると、ブラウザが近い太さで勝手に代用してしまいます。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;800&display=swap" rel="stylesheet">

<style>/* 文字はすべて M+1p Heavy(800)。小さい文字だけ個別に Bold(700) に落としている。
   html/body にだけ太さを置き、あとは親から受け継がせる（下の要素は、
   見出しなどがブラウザ既定で勝手に太くなるのを打ち消して受け継ぎに戻す）。 */
html, body { font-weight: 800; }
h1, h2, h3, h4, h5, h6, b, strong, th, summary,
button, input, select, textarea, option, optgroup, legend { font-weight: inherit; }


  /* ---------- 全体の色づかい ---------- */
  :root{
    --yozora-1:#2B0A1E;   /* 夜空のいちばん濃いところ */
    --yozora-2:#40122C;
    --yozora-3:#5A1442;
    --moji:#FFEAF4;
    --moji-usui:#DCA6C2;
    --hoshi:#FFB3D9;      /* 星のいろ */
    --waku:rgba(255,190,220,.12);
    --waku-sen:rgba(255,190,220,.22);
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    background:linear-gradient(165deg,var(--yozora-1) 0%,var(--yozora-2) 55%,var(--yozora-3) 100%);
    color:var(--moji);
    /* ポケスリと同じ書体。読み込めなかったときは、後ろの書体が使われます */
    font-family:"M PLUS 1p","Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- 背景の星 ---------- */
  #hoshizora{
    position:fixed; inset:0;
    pointer-events:none;   /* 星はクリックの邪魔をしない */
    z-index:0;
  }
  .hoshi{
    position:absolute;
    border-radius:50%;
    background:var(--hoshi);
    animation:matataki 4s ease-in-out infinite;
  }
  @keyframes matataki{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%    { opacity:.85; transform:scale(1.4); }
  }

  /* ---------- 上のバー ---------- */
  header{
    position:relative; z-index:2;
    padding:14px 20px 10px;
    text-align:center;
    transition:opacity .5s;
  }
  /* タイトルは上下2段。上に小さくタグ、下に大きく写真たての名前 */
  header h1{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
    line-height:1.25;
  }
  header .tag{
    font-size:clamp(13px,1.7vw,18px);
    font-weight:800;
    letter-spacing:.05em;
    color:var(--hoshi);
  }
  header .title{
    font-size:clamp(23px,3.6vw,36px);
    font-weight:800;
    letter-spacing:.09em;
    text-shadow:0 2px 10px rgba(0,0,0,.45);
  }
  header .kazu{
    margin-top:5px;
    font-size:12px;
    font-weight:700;
    color:var(--moji-usui);
  }

  /* 自動めくりの残り時間バー */
  #bar-soto{
    position:relative; z-index:2;
    height:3px;
    background:rgba(255,255,255,.08);
  }
  #bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--hoshi),#c4a4ff);
  }

  /* ---------- まんなか（ポストが出るところ） ---------- */
  #butai{
    position:relative; z-index:2;
    flex:1;
    min-height:0;             /* これがないと、長いポストが下のボタンに重なってしまいます */
    display:flex;
    align-items:flex-start;   /* 縦に長いポストでも、上が切れないようにするため */
    justify-content:center;
    padding:18px 14px;
    overflow-y:auto;
    overflow-x:hidden;
  }

  /* ポスト1件ぶんの入れもの＝写真たての「額」 */
  .gaku{
    /* 出番でないあいだは、画面の外に置いておきます。
       display:none で消してしまうと、Xの埋め込みがうまく作られないためです。 */
    position:absolute;
    left:-99999px;
    top:0;
    width:560px;
    padding:14px;
    border-radius:20px;
    background:var(--waku);
    border:1px solid var(--waku-sen);
    box-shadow:0 24px 70px rgba(0,0,0,.55);
  }
  .gaku.hyouji{               /* 表示中の1件だけ、これが付きます */
    position:static;
    width:100%;
    max-width:560px;
    margin:auto;              /* 短いポストは画面のまんなかに浮かびます */
    animation:ukabu .7s ease both;
  }
  @keyframes ukabu{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to  { opacity:1; transform:none; }
  }

  /* ---------- お知らせ（読み込み中・エラー・空っぽ） ---------- */
  #oshirase{
    position:relative; z-index:2;
    margin:auto;
    max-width:520px;
    text-align:center;
    line-height:1.9;
    font-size:14px;
    color:var(--moji-usui);
  }
  #oshirase b{ color:var(--moji); }
  #oshirase.kesu{ display:none; }

  /* 縦に長いポストのときに出るスクロールバーを、目立たない見た目にします */
  #butai::-webkit-scrollbar{ width:8px; }
  #butai::-webkit-scrollbar-track{ background:transparent; }
  #butai::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.20);
    border-radius:4px;
  }
  #butai::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.35); }

  /* ---------- 下のボタン ---------- */
  footer{
    position:relative; z-index:2;
    /* 下からうっすら暗くして、ポストと重なってもボタンが読めるようにします */
    background:linear-gradient(to top,rgba(43,10,30,.92),rgba(43,10,30,0));
    padding:20px 16px 20px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    transition:opacity .5s;
  }
  button{
    font:inherit;
    font-size:14px;
    font-weight:800;
    letter-spacing:.04em;
    color:var(--moji);
    background:rgba(255,255,255,.09);
    border:1px solid var(--waku-sen);
    border-radius:999px;
    padding:9px 18px;
    cursor:pointer;
    transition:background .2s,transform .1s;
  }
  button:hover{ background:rgba(255,255,255,.18); }
  button:active{ transform:scale(.96); }

  .setumei{
    position:relative; z-index:2;
    background:rgba(43,10,30,.92);
    text-align:center;
    font-size:11px;
    color:var(--moji-usui);
    padding-bottom:6px;
    transition:opacity .5s;font-weight:700
  }

  /* 公開したときのための表記。ここだけは消えないようにしてあります */
  .chuusyaku{
    position:relative; z-index:2;
    background:rgba(43,10,30,.92);
    text-align:center;
    font-size:11px;
    font-weight:700;
    line-height:1.7;
    color:#8b83b5;
    padding:0 16px 12px;
    transition:opacity .5s;
  }
  .chuusyaku a{
    color:#a79fd0;
    text-decoration:underline;
  }

  /* マウスをしばらく動かさないと、上下がすっと消えます（写真たてらしく） */
  body.nemui header,
  body.nemui footer,
  body.nemui .setumei{ opacity:0; }
  /* ただし「非公式です」の表記だけは、うっすら残します */
  body.nemui .chuusyaku{ opacity:.3; }

  /* ---------- スマホで見るとき ----------
     画面が狭いので、写真じたいをできるだけ大きく見せるために
     まわりの飾りを減らします。 */
  @media (max-width:600px){
    header{ padding:10px 14px 6px; }
    /* 13.5px より小さい文字は、つぶれないように Bold(700) に落とします */
    header .tag{ font-size:12px; font-weight:700; }
    header .title{ font-size:22px; letter-spacing:.06em; }
    header .kazu{ display:none; }      /* 件数の表示は場所を取るので隠します */
    .gaku{ padding:10px; }
    footer{ gap:7px; padding:16px 10px 14px; }
    button{ padding:8px 13px; font-size:12px; font-weight:700; }
    .setumei{ display:none; }          /* キーボードの説明はスマホには不要 */
    .pc-only{ display:none; }          /* ボタンの文字を短くします */
    /* 非公式である表記は必ず残しつつ、2行に収めて写真の場所をゆずります */
    .chuusyaku{ font-size:10px; padding:0 10px 10px; line-height:1.6; }
  }
</style>
</head>
<body>

<div id="hoshizora"></div>

<header>
  <h1>
    <span class="tag">🧸 #ポケスリぬい活部</span>
    <span class="title">デジタル写真たて</span>
  </h1>
  <div class="kazu" id="kazu"></div>
</header>

<div id="bar-soto"><div id="bar"></div></div>

<main id="butai">
  <div id="oshirase">読み込んでいます…</div>
</main>

<footer>
  <button id="btn-mae">◀ まえ</button>
  <button id="btn-tomeru">⏸ とめる</button>

<div class="setumei">← → でめくる ／ スペースキーでとめる ／ F で全画面</div>

<!-- 公開したときのための表記。消さないでください。 -->
<div class="chuusyaku">
  ファンが作った非公式のページです ／

<!-- Xの公式ライブラリ（ポストをそのまま埋め込むための道具）を読み込みます -->
<script>
window.twttr = (function(d,s,id){
  var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {};
  if (d.getElementById(id)) return t;
  js = d.createElement(s); js.id = id;
  js.src = "https://platform.twitter.com/widgets.js";
  fjs.parentNode.insertBefore(js, fjs);
  t._e = [];
  t.ready = function(f){ t._e.push(f); };
  return t;
}(document,"script","twitter-wjs"));
</script>

<!-- 飾るポストの一覧 -->
<script src="posts.js"></script>

<script>
/* =========================================================
   ここから下が、写真たての動きを決めている部分です。
   ========================================================= */

// 1枚を映しておく秒数。ここの数字を変えれば、めくる速さが変わります。
// 目安： 8 = さくさく ／ 12 = ちょうどいい ／ 20 = じっくり読める
const ヒョウジビョウスウ = 12;

// 覚えておく枚数（「まえ」で戻れる上限）
const リレキジョウゲン = 12;

const 舞台     = document.getElementById('butai');
const お知らせ  = document.getElementById('oshirase');
const バー     = document.getElementById('bar');
const 枚数表示  = document.getElementById('kazu');

let 全部     = (window.POSTS || []).filter(function(u){ return 取り出すID(u); });
let 山札     = [];        // これから出す順番（シャッフル済み）
let 履歴     = [];        // すでに映したもの
let 今の位置  = -1;
let 止めてる  = false;
let タイマー  = null;
let 先読み    = null;     // 次の1枚を、裏で用意しておく置き場

/* --- URLから「ポストの番号」だけを取り出す --- */
function 取り出すID(url){
  var m = String(url).match(/status\/(\d+)/);
  return m ? m[1] : null;
}

/* --- 順番を混ぜる（毎回ちがう順で出るように） --- */
function シャッフル(はいれつ){
  var a = はいれつ.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* --- 次に出すURLを1つ取り出す。ぜんぶ出しきったら混ぜ直す --- */
var 直前のURL = null;

function 次のURL(){
  if(山札.length === 0){
    山札 = シャッフル(全部);
    // 混ぜ直した直後に、いま出たばかりのものがまた出ないように入れかえます
    var 最後 = 山札.length - 1;
    if(全部.length > 1 && 直前のURL && 山札[最後] === 直前のURL){
      var t = 山札[最後]; 山札[最後] = 山札[0]; 山札[0] = t;
    }
  }
  直前のURL = 山札.pop();
  return 直前のURL;
}

/* --- Xのポストを1件ぶん作る。作れなければ null を返す --- */
function ポストを作る(url){
  return new Promise(function(resolve){
    var id = 取り出すID(url);
    if(!id) return resolve(null);

    var 額 = document.createElement('div');
    額.className = 'gaku';
    舞台.appendChild(額);   // 先に置いておくと、裏で読み込みが進みます

    var 終わった = false;

    // 15秒たっても出てこなければ、あきらめて次へ進みます
    var 見切り = setTimeout(function(){
      if(終わった) return;
      終わった = true;
      額.remove();
      resolve(null);
    }, 15000);

    twttr.widgets.createTweet(id, 額, {
      lang: 'ja',
      theme: 'dark',
      align: 'center',
      dnt: true,             // 行動追跡をさせない設定
      conversation: 'none'   // 返信は出さず、ポスト本体だけ映します
    }).then(function(youso){
      if(終わった) return;
      終わった = true;
      clearTimeout(見切り);
      if(!youso){            // 消されたポスト・非公開のポストはここに来ます
        額.remove();
        resolve(null);
      }else{
        resolve({ url: url, 額: 額 });
      }
    })['catch'](function(){
      if(終わった) return;
      終わった = true;
      clearTimeout(見切り);
      額.remove();
      resolve(null);
    });
  });
}

/* --- 映せるポストが見つかるまで、順に試します --- */
async function 映せるものを探す(){
  var 試す回数 = Math.min(全部.length, 10);
  for(var i = 0; i < 試す回数; i++){
    var できた = await ポストを作る(次のURL());
    if(できた) return できた;
  }
  return null;
}

/* --- 次の1枚を、裏でこっそり用意しておきます --- */
async function 先に読んでおく(){
  if(先読み || 全部.length === 0) return;
  先読み = await 映せるものを探す();
}

/* --- 実際に画面へ映します --- */
function 映す(もの){
  お知らせ.classList.add('kesu');
  Array.prototype.forEach.call(舞台.children, function(c){
    if(c.classList) c.classList.remove('hyouji');
  });
  もの.額.classList.add('hyouji');
  枚数表示.textContent = '登録 ' + 全部.length + ' 件のなかから、ランダムに表示中';
  タイマーを引き直す();
}

/* --- 自動めくりの時間を測り直します --- */
function タイマーを引き直す(){
  clearTimeout(タイマー);
  バー.style.transition = 'none';
  バー.style.width = '0%';
  void バー.offsetWidth;            // ここで一度リセットを確定させます
  if(止めてる) return;
  バー.style.transition = 'width ' + ヒョウジビョウスウ + 's linear';
  バー.style.width = '100%';
  タイマー = setTimeout(つぎへ, ヒョウジビョウスウ * 1000);
}

/* --- つぎへ --- */
async function つぎへ(){
  clearTimeout(タイマー);

  // 「まえ」で戻っている最中なら、まず履歴を進みます
  if(今の位置 < 履歴.length - 1){
    今の位置++;
    映す(履歴[今の位置]);
    return;
  }

  var もの = 先読み;
  先読み = null;

  if(!もの){
    お知らせ.classList.remove('kesu');
    お知らせ.textContent = '読み込んでいます…';
    もの = await 映せるものを探す();
  }
  if(!もの){
    こまった('ポストを表示できませんでした。<br>ネットにつながっているか、'
           + '<b>posts.js</b> のURLが正しいかを確認してください。');
    return;
  }

  履歴.push(もの);
  if(履歴.length > リレキジョウゲン){
    var 捨てる = 履歴.shift();
    捨てる.額.remove();            // 古いものは画面から片付けます
  }
  今の位置 = 履歴.length - 1;
  映す(もの);
  先に読んでおく();
}

/* --- まえへ --- */
function まえへ(){
  if(今の位置 <= 0) return;        // これ以上は戻れません
  今の位置--;
  映す(履歴[今の位置]);
}

/* --- とめる／再開する --- */
function とめる切替(){
  止めてる = !止めてる;
  document.getElementById('btn-tomeru').textContent = 止めてる ? '▶ 再開' : '⏸ とめる';
  タイマーを引き直す();
}

/* --- いま映しているポストを、Xで開く --- */
function 元postを開く(){
  var いま = 履歴[今の位置];
  if(!いま) return;
  window.open(いま.url, '_blank', 'noopener');
}

/* --- 全画面にする／もどす（パソコンで F キーを押したときだけ使います） --- */
function 全画面切替(){
  if(document.fullscreenElement){
    document.exitFullscreen();
  }else{
    document.documentElement.requestFullscreen();
  }
}

/* --- 困ったときの表示 --- */
function こまった(html){
  clearTimeout(タイマー);
  バー.style.width = '0%';
  お知らせ.classList.remove('kesu');
  お知らせ.innerHTML = html;
}

/* --- 背景の星をばらまきます --- */
(function 星をつくる(){
  var 空 = document.getElementById('hoshizora');
  for(var i = 0; i < 60; i++){
    var h = document.createElement('div');
    h.className = 'hoshi';
    var おおきさ = Math.random() * 2 + 1;
    h.style.width  = おおきさ + 'px';
    h.style.height = おおきさ + 'px';
    h.style.left   = Math.random() * 100 + '%';
    h.style.top    = Math.random() * 100 + '%';
    h.style.animationDelay = (Math.random() * 4) + 's';
    空.appendChild(h);
  }
})();

/* --- ボタンとキーボードの割りあて --- */
document.getElementById('btn-tsugi').onclick    = つぎへ;
document.getElementById('btn-mae').onclick      = まえへ;
document.getElementById('btn-tomeru').onclick   = とめる切替;
document.getElementById('btn-moto').onclick     = 元postを開く;

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight'){ つぎへ(); }
  if(e.key === 'ArrowLeft') { まえへ(); }
  if(e.key === ' ')         { e.preventDefault(); とめる切替(); }
  if(e.key === 'f' || e.key === 'F'){ 全画面切替(); }
});

/* --- 別のタブを見ているあいだ、Xの埋め込みは作られません。
       この写真たてに戻ってきたとき、まだ1枚も出ていなければ作り直します。 --- */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  if(document.querySelector('.gaku.hyouji')) return;   // すでに映っていれば、なにもしません
  if(全部.length === 0) return;
  こまった('読み込んでいます…');
  つぎへ();
});

/* --- マウスを3秒動かさないと、上下のボタンがすっと消えます --- */
var ねむりタイマー = null;
function 目をさます(){
  document.body.classList.remove('nemui');
  clearTimeout(ねむりタイマー);
  ねむりタイマー = setTimeout(function(){
    document.body.classList.add('nemui');
  }, 3000);
}
document.addEventListener('mousemove', 目をさます);
document.addEventListener('touchstart', 目をさます);
目をさます();

/* --- ここからスタートします --- */
